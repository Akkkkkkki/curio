<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f4" />
    <title>Curio - Personal Museum</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Suppress Tailwind CDN production warning - CDN is intentionally used for this project
      const originalWarn = console.warn;
      const originalError = console.error;
      const shouldSuppress = (args) =>
        args &&
        args[0] &&
        typeof args[0] === 'string' &&
        (args[0].includes('Tailwind') || args[0].includes('CDN'));
      console.warn = function (...args) {
        if (shouldSuppress(args)) {
          return;
        }
        originalWarn.apply(console, args);
      };
      console.error = function (...args) {
        if (shouldSuppress(args)) {
          return;
        }
        originalError.apply(console, args);
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['DM Serif Display', 'serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            animation: {
              'spin-slow': 'spin 12s linear infinite',
            },
            boxShadow: {
              gallery: '0 2px 8px rgba(0,0,0,0.06)',
              'gallery-hover': '0 4px 16px rgba(0,0,0,0.08)',
              vault: '0 4px 16px rgba(0,0,0,0.5)',
              'vault-hover': '0 8px 32px rgba(0,0,0,0.6)',
              atelier: '0 2px 12px rgba(168,111,60,0.10)',
              'atelier-hover': '0 4px 20px rgba(168,111,60,0.14)',
            },
          },
        },
      };
    </script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        background-color: #f5f5f4;
      }
      :root {
        --bottom-nav-height: 5.5rem;
      }
      @media (max-height: 600px) {
        :root {
          --bottom-nav-height: 4.5rem;
        }
      }
      /* Custom scrollbar to match aesthetic */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e7e5e4;
        border-radius: 10px;
        border: 3px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d6d3d1;
        border: 3px solid transparent;
        background-clip: padding-box;
      }

      /* Smooth item transitions */
      .animate-in {
        animation-fill-mode: both;
      }
      .fade-in {
        animation: motionFade 280ms ease-out both;
      }
      .slide-in-from-bottom-4 {
        animation: motionSlideUp 320ms ease-out both;
      }
      .zoom-in-95 {
        animation: motionPanel 260ms ease-out forwards;
      }
      .zoom-in-95.duration-500 {
        animation-duration: 500ms;
      }
      @keyframes motionPop {
        0% {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .motion-pop {
        animation: motionPop 220ms ease-out;
      }
      @keyframes motionPanel {
        0% {
          opacity: 0;
          transform: translateY(16px) scale(0.96);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }
      .motion-panel {
        animation: motionPanel 220ms cubic-bezier(0.25, 0.9, 0.3, 1);
      }
      @keyframes motionFade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .motion-fade {
        animation: motionFade 260ms ease-out;
      }
      .motion-overlay {
        animation: motionFade 220ms ease-out;
        backdrop-filter: blur(6px);
      }
      @keyframes motionSlideUp {
        0% {
          opacity: 0;
          transform: translateY(18px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .motion-slide-up {
        animation: motionSlideUp 260ms ease-out;
      }
      @keyframes motionCard {
        0% {
          opacity: 0;
          transform: translateY(12px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .motion-card {
        animation: motionCard 260ms ease-out;
      }
      @keyframes motionChip {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .motion-chip {
        animation: motionChip 200ms ease-out;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      /* Print styles */
      @media print {
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        html,
        body {
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
        }
        /* Hide everything using visibility */
        body * {
          visibility: hidden !important;
        }
        /* Reset backgrounds to prevent dark areas */
        body *:not(#card-preview):not(#card-preview *) {
          background: transparent !important;
          backdrop-filter: none !important;
        }
        /* Show card preview and contents */
        #card-preview,
        #card-preview * {
          visibility: visible !important;
        }
        #card-preview {
          position: fixed !important;
          left: 50% !important;
          top: 10mm !important;
          transform: translateX(-50%) !important;
          width: 80mm !important;
          max-width: none !important;
          max-height: none !important;
          height: auto !important;
          margin: 0 !important;
          box-shadow: none !important;
          page-break-inside: avoid;
        }
      }
      /* Skip-to-content link (a11y) */
      .skip-link {
        position: absolute;
        left: -10000px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      .skip-link:focus {
        position: fixed;
        top: 8px;
        left: 8px;
        width: auto;
        height: auto;
        padding: 8px 16px;
        background: #292524;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        border-radius: 8px;
        z-index: 10000;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
