<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f4" />
    <title>Curio - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f4;
        color: #292524;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .card {
        max-width: 320px;
        padding: 32px 28px;
        border-radius: 24px;
        background: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: #57534e;
      }
      .hint {
        margin-top: 12px;
        font-size: 12px;
        color: #a8a29e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 data-i18n="title">You're offline</h1>
      <p data-i18n="body">
        Curio needs a connection to load new content. Your local data will appear when you're back
        online.
      </p>
      <p class="hint" data-i18n="hint">Reconnect and refresh to continue.</p>
    </div>
    <script>
      (function () {
        var lang = 'en';
        try {
          var stored = window.localStorage && window.localStorage.getItem('curio_language');
          if (stored === 'zh' || stored === 'en') {
            lang = stored;
          }
        } catch (e) {
          lang = 'en';
        }

        var copy = {
          en: {
            title: "You're offline",
            body: "Curio needs a connection to load new content. Your local data will appear when you're back online.",
            hint: 'Reconnect and refresh to continue.',
          },
          zh: {
            title: '当前离线',
            body: 'Curio 需要联网加载新内容。恢复网络后会显示您的本地数据。',
            hint: '请重新连接网络并刷新。',
          },
        };

        var dict = copy[lang] || copy.en;
        var title = document.querySelector('[data-i18n="title"]');
        var body = document.querySelector('[data-i18n="body"]');
        var hint = document.querySelector('[data-i18n="hint"]');
        if (title) title.textContent = dict.title;
        if (body) body.textContent = dict.body;
        if (hint) hint.textContent = dict.hint;
        document.documentElement.lang = lang;
      })();
    </script>
  </body>
</html>
