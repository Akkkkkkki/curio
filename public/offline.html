<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f4" />
    <title>Curio - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f4;
        color: #292524;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .card {
        max-width: 320px;
        padding: 32px 28px;
        border-radius: 24px;
        background: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: #57534e;
      }
      .hint {
        margin-top: 12px;
        font-size: 12px;
        color: #a8a29e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        Curio needs a connection to load new content. Your local data will appear when you're back
        online.
      </p>
      <p class="hint">Reconnect and refresh to continue.</p>
    </div>
  </body>
</html>
