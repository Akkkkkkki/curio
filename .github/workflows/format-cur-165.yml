name: Format CUR-165 branch

on:
  push:
    branches:
      - q/cur-165-shared-ai-operations

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: q/cur-165-shared-ai-operations
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format touched files
        run: >-
          npx prettier --write
          api/gemini/analyze.js
          api/gemini/suggest-fields.js
          server/ai/operations.js
          server/geminiProxy.js
          tests/server/aiOperations.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/gemini/analyze.js api/gemini/suggest-fields.js server/ai/operations.js server/geminiProxy.js tests/server/aiOperations.test.ts
          git commit -m "chore: format CUR-165 changes"
          git push origin HEAD:q/cur-165-shared-ai-operations
